# Re-judge a pull request whenever the operator's decision on it changes.
#
# The merge-ready gate admits a machine-authored change that a pinned operator approved on the exact
# head (aeos/operator_approval.py). The gate runs when the machine opens or pushes; a review is not one of
# its triggers. So when a decisive review lands (an approval or a change request) or a review is dismissed,
# this re-runs the latest aeos-merge-ready run at the pull request's head, whatever that run concluded:
# an approval can turn a refusal green, and a change request or dismissal turns an approval-based green
# back into a refusal. A run still in flight is waited for, within a bound, so a decision that lands
# while the gate is reading never strands. One job per pull request runs at a time; a newer decision
# replaces a queued one, and the running one finishes and re-runs the gate afresh.
#
# Nothing here decides anything: a re-run keeps the original run's actor and the gate re-reads every
# fact, from trusted policy. It is not a required workflow and publishes no `aeos-merge-ready` context.
name: aeos-approval-rerun

on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: aeos-approval-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.action == 'dismissed'
      || github.event.review.state == 'approved'
      || github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Re-run the merge-ready verdict at the current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          latest() {
            gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "aeos-merge-ready")] | sort_by(.created_at) | last
                    | select(. != null) | "\(.id) \(.status)"'
          }
          # Bounded: at most 40 reads, 15 s apart. A failed read is retried, never taken as "no run"; an
          # empty answer is believed only when the next read agrees (the head_sha filter can briefly
          # return nothing for a sha that has runs).
          empty=0
          run_id=""
          for _ in $(seq 1 40); do
            if ! found="$(latest)"; then
              sleep 15
              continue
            fi
            if [ -z "$found" ]; then
              empty=$((empty + 1))
              if [ "$empty" -ge 2 ]; then
                echo "No aeos-merge-ready run at ${HEAD_SHA}; the next push is judged afresh."
                exit 0
              fi
              sleep 15
              continue
            fi
            empty=0
            read -r run_id status <<<"$found"
            if [ "$status" = "completed" ]; then
              gh api -X POST "repos/${REPO}/actions/runs/${run_id}/rerun"
              echo "Re-ran aeos-merge-ready run ${run_id} at ${HEAD_SHA}."
              exit 0
            fi
            sleep 15
          done
          echo "::error::the aeos-merge-ready run at ${HEAD_SHA} (${run_id:-unread}) was not re-run within the bound; the decision was not re-judged."
          exit 1

# Re-judge a pull request whenever the operator's decision on it, or its description, changes.
#
# The merge-ready gate admits a machine-authored change that a pinned operator approved on the exact
# head (aeos/operator_approval.py), and it judges the description it was triggered with. A review or a
# description edit is not one of its triggers. So on an approval, a change request, a dismissal or an
# edit, this re-runs the latest aeos-merge-ready run at the pull request's head, whatever it concluded:
# an approval can turn a refusal green; a change request, a dismissal or an edited description turns an
# approval-based green back into a refusal. A gate run still in flight is cancelled first, so a verdict
# read before the change can never publish a mergeable success; the re-run replaces it. A run that
# cannot be found or re-run within the bound fails this job visibly; absence is never believed.
#
# Residual, stated: a green already published and consumed by auto-merge before this job starts cannot be
# recalled. That is the same interval an operator-opened change has between a green gate and its merge;
# the remedy is a revert.
#
# Nothing here decides anything: a re-run keeps the original run's actor and the gate re-reads every
# fact, from trusted policy. It is not a required workflow and publishes no `aeos-merge-ready` context.
name: aeos-approval-rerun

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [edited]

permissions: {}

jobs:
  rerun:
    if: >-
      github.event_name == 'pull_request'
      || github.event.action == 'dismissed'
      || github.event.review.state == 'approved'
      || github.event.review.state == 'changes_requested'
    # On the job, so an event this job skips (a comment-only review) never takes or replaces a queued slot.
    concurrency:
      group: aeos-approval-rerun-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Re-run the merge-ready verdict at the current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          latest() {
            gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "aeos-merge-ready")] | sort_by(.created_at) | last
                    | select(. != null) | "\(.id) \(.status)"'
          }
          # Bounded: at most 60 reads, 10 s apart. A failed or empty read is retried, never taken as "no run".
          # A run in flight is cancelled once (its verdict was read before this change), then re-run when it
          # has settled.
          cancelled=""
          run_id=""
          for _ in $(seq 1 60); do
            if ! found="$(latest)" || [ -z "$found" ]; then
              sleep 10
              continue
            fi
            read -r run_id status <<<"$found"
            if [ "$status" != "completed" ]; then
              if [ "$cancelled" != "$run_id" ]; then
                gh api -X POST "repos/${REPO}/actions/runs/${run_id}/cancel" >/dev/null || true
                cancelled="$run_id"
              fi
              sleep 10
              continue
            fi
            gh api -X POST "repos/${REPO}/actions/runs/${run_id}/rerun"
            echo "Re-ran aeos-merge-ready run ${run_id} at ${HEAD_SHA}."
            exit 0
          done
          echo "::error::the aeos-merge-ready run at ${HEAD_SHA} (${run_id:-never found}) was not re-run within the bound; the change was not re-judged."
          exit 1

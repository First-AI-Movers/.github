# AEOS organization merge-ready gate.
#
# This is the organization-owned required workflow for the AUTONOMOUS-MAIN
# lifecycle. It is repository-agnostic: it depends on no file existing in the
# repository it runs against, and a brand-new repository passes.
#
# Trust model: the candidate (the bytes a pull request proposes) is DATA. Only
# the policy checkout executes. Candidate tests, candidate scripts, candidate
# configuration and candidate workflows are never run.
#
# The check context this publishes is the job name `aeos-merge-ready`. Renaming
# the job silently detaches every ruleset and auto-merge that reads that name.
name: aeos-merge-ready

# Only events that carry a real two-endpoint commit range. `workflow_dispatch`
# is deliberately absent: a dispatched run has no range to measure, and it would
# publish a green under this job's name -- the exact context rulesets and
# auto-merge read -- on whatever branch tip it was run against.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  merge_group:

# No `concurrency` block, deliberately: a cancelled required run leaves a head
# commit with no verdict, which is indistinguishable from a head that was never
# evaluated.

permissions:
  contents: read

jobs:
  aeos-merge-ready:
    name: aeos-merge-ready
    runs-on: ubuntu-latest
    # A hang bound, not the budget. The budget is enforced twice inside the
    # gate step: an external `timeout` and the gate's own self-measurement.
    timeout-minutes: 10
    permissions:
      contents: read
      # Read-only: the evidence step reads the pull request and the programme Issue it names
      # with the workflow's own token. Nothing here can write, and the gate itself stays networkless.
      pull-requests: read
      issues: read

    steps:
      - name: Check out candidate (untrusted data)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Check out trusted policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: First-AI-Movers/.github
          ref: main
          path: policy
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Collect authenticated evidence (trusted; machine route)
        # #3752 Slice A. Writes ONE aeos-actor-evidence/v1 file from GitHub-authenticated facts:
        # the pull-request author (login + type) and actor from the event payload FILE (never
        # interpolated into this script), and the programme Issue the PR body names with
        # `<!-- aeos-programme: owner/repo#N -->`, read with `gh api` under the job token. Any
        # failure writes an evidence file that says why, so the gate fails closed to the
        # break-glass SSH route instead of guessing. Also recorded: the head commit's author
        # and the programme Issue's content-edit history, so a collaborator push or a body
        # edit by a non-operator cannot ride on a bot-authored PR or an operator-created Issue.
        # On merge_group the queued PR is resolved from the queue's head ref.
        env:
          GH_TOKEN: ${{ github.token }}
          AEOS_EVENT_NAME: ${{ github.event_name }}
          AEOS_EVENT_PATH: ${{ github.event_path }}
          AEOS_ACTOR: ${{ github.actor }}
          AEOS_REPOSITORY: ${{ github.repository }}
          AEOS_ACTOR_EVIDENCE: ${{ runner.temp }}/aeos-actor-evidence.json
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time
          sys.path.insert(0, os.path.abspath('policy/aeos'))
          import derivation_policy
          out = os.environ["AEOS_ACTOR_EVIDENCE"]
          repo = os.environ.get("AEOS_REPOSITORY", "")
          event_name = os.environ.get("AEOS_EVENT_NAME", "")
          doc = {"schema": "aeos-actor-evidence/v1", "event": event_name, "repository": repo,
                 "actor": os.environ.get("AEOS_ACTOR", ""),
                 # agent-toolkit #3052: this definition's job carries "Recheck an accepted protected change before this
                 # verdict publishes". Without this capability no acceptance admits (aeos/accepted_change.py).
                 "accepted_change_barrier": "aeos-accepted-change-barrier/v1"}
          def api(path, *args):
              r = subprocess.run(["gh", "api", path, *args], capture_output=True, text=True, timeout=30, check=False)
              return json.loads(r.stdout) if r.returncode == 0 and r.stdout.strip() else None
          try:
              with open(os.environ["AEOS_EVENT_PATH"], encoding="utf-8") as handle:
                  event = json.load(handle)
              pr = event.get("pull_request") if isinstance(event, dict) else None
              if pr is None and event_name == "merge_group":
                  # The queue's head ref names the queued PR: refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>
                  head_ref = ((event.get("merge_group") or {}).get("head_ref") or "")
                  m = re.search(r"/pr-([1-9][0-9]*)-[0-9a-f]{40}$", head_ref)
                  if m:
                      pr = api(f"repos/{repo}/pulls/{m.group(1)}")
              if isinstance(pr, dict):
                  user = pr.get("user") or {}
                  body = pr.get("body") or ""
                  head_sha = (pr.get("head") or {}).get("sha")
                  commit = api(f"repos/{repo}/commits/{head_sha}") if head_sha else None
                  doc["pull_request"] = {"number": pr.get("number"), "author_login": user.get("login"),
                                         "author_type": user.get("type"), "head_sha": head_sha, "body": body,
                                         "head_commit_author_login": ((commit or {}).get("author") or {}).get("login")}
                  # The trusted policy, read once. An unreadable policy binds no approval route here; the programme
                  # read below re-raises its error, so that path fails closed exactly as before.
                  trusted_error = None
                  try:
                      trusted = derivation_policy.load_policy('policy/aeos')
                  except Exception as error:  # noqa: BLE001 - re-raised where the programme needs it
                      trusted, trusted_error = None, error
                  # #3052 paperwork removal: the reviews, only when the trusted policy switches the operator-approval
                  # route on. Any failure here records UNREAD, which the judge refuses, and leaves every other
                  # piece of evidence below to be collected exactly as before.
                  try:
                      import operator_approval
                      if operator_approval.enabled(getattr(trusted, 'operator_approval', None)):
                          doc["pull_request"]["approval"] = operator_approval.collect(
                              api, repo, pr.get("number"), head_sha, body)
                  except Exception:  # noqa: BLE001 - recorded, never raised past the other evidence
                      doc["pull_request"]["approval"] = {"context": "UNREAD", "reviews": None}
                  refs = re.findall(r"<!--\s*aeos-programme:\s*([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[1-9][0-9]*)\s*-->", body)
                  if len(refs) == 1:
                      prepo, number = refs[0].split("#")
                      issue = api(f"repos/{prepo}/issues/{number}")
                      if issue is not None:
                          owner, name = prepo.split("/", 1)
                          query = ("query($o:String!,$n:String!,$i:Int!){repository(owner:$o,name:$n){issue(number:$i){"
                                   "userContentEdits(first:100){totalCount nodes{editor{login}}}}}}")
                          edits = api("graphql", "-f", f"query={query}", "-f", f"o={owner}", "-f", f"n={name}", "-F", f"i={number}")
                          editors = None
                          try:
                              uce = edits["data"]["repository"]["issue"]["userContentEdits"]
                              if uce["totalCount"] <= 100:
                                  editors = [((n.get("editor") or {}).get("login") or "") for n in uce["nodes"]]
                          except (KeyError, TypeError):
                              editors = None
                          iu = issue.get("user") or {}
                          doc["programme"] = {"ref": refs[0], "state": issue.get("state"), "author_login": iu.get("login"),
                                              "author_type": iu.get("type"), "body": issue.get("body") or "",
                                              "updated_at": issue.get("updated_at"), "editors": editors}
                          if trusted_error is not None:
                              raise trusted_error
                          operand = getattr(trusted, 'comment_operand', None)
                          if operand is not None and operand['programme'] == refs[0]:
                              import comment_operand
                              doc['comment_sources'] = comment_operand.collect(operand, api, time.time())
                          # #3052 Class B: the scoped machine grant this PR names (if any), read with the job's
                          # own read-only token. The gate judges it networklessly; no binding, no collection.
                          grant = getattr(trusted, 'scoped_grant', None)
                          if grant is not None and grant['programme'] == refs[0]:
                              import scoped_grant
                              doc['scoped_grant'] = scoped_grant.collect(grant, body, api, time.time())
                      else:
                          doc["programme"] = {"ref": refs[0], "unavailable": "programme issue could not be read"}
          except Exception as error:  # noqa: BLE001 - the gate fails closed on this file
              doc["unavailable"] = type(error).__name__
          with open(out, "w", encoding="utf-8") as handle:
              json.dump(doc, handle)
          PY

      - name: Gate
        env:
          # Every value the gate reads arrives as an environment variable.
          # Nothing from the event is interpolated into the shell body, so no
          # candidate-controlled string can become a command.
          AEOS_REPOSITORY: ${{ github.repository }}
          AEOS_EVENT_NAME: ${{ github.event_name }}
          AEOS_BASE_SHA: >-
            ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha
            || github.event_name == 'pull_request' && github.event.pull_request.base.sha
            || github.sha }}
          AEOS_HEAD_SHA: >-
            ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha
            || github.event_name == 'pull_request' && github.event.pull_request.head.sha
            || github.sha }}
          # The gate's own hard budget sits below the external ceiling, so it
          # is the layer that normally fires and the external timer is the
          # backstop for a body that never reaches its own measurement.
          AEOS_GATE_BUDGET_SECONDS: "45"
          AEOS_CEILING_SECONDS: "60"
          AEOS_SOFT_BUDGET_SECONDS: "10"
          AEOS_ACTOR_EVIDENCE: ${{ runner.temp }}/aeos-actor-evidence.json
          AEOS_APPROVAL_MARKER: ${{ runner.temp }}/aeos-approval-marker.json
        run: |
          set -uo pipefail
          python3 -VV
          set +e
          timeout --signal=TERM --kill-after=10s "${AEOS_CEILING_SECONDS}s" \
            python3 policy/aeos/merge_ready_gate.py \
              --candidate-dir candidate \
              --hard-budget-seconds "${AEOS_GATE_BUDGET_SECONDS}" \
              --soft-budget-seconds "${AEOS_SOFT_BUDGET_SECONDS}" \
              --evidence-file "${AEOS_ACTOR_EVIDENCE}" \
              --approval-marker-file "${AEOS_APPROVAL_MARKER}"
          rc=$?
          set -e
          # 0 is PASS and 1 is a verdict the gate already reported with a typed
          # reason. Anything else means the gate never reached its own reporting,
          # so map it onto the same closed vocabulary rather than letting a bare
          # non-zero exit stand in for a reason.
          case "$rc" in
            0|1)
              exit "$rc"
              ;;
            124|137)
              code="BUDGET_EXCEEDED"
              detail="the gate body exceeded the external ${AEOS_CEILING_SECONDS}s ceiling"
              ;;
            *)
              code="EVIDENCE_UNREADABLE"
              detail="the gate terminated abnormally (exit ${rc})"
              ;;
          esac
          line="AEOS_MERGE_READY_RESULT: FAIL ${code}"
          echo "$line"
          echo "$detail"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## aeos-merge-ready"
              echo ""
              echo "$line"
              echo ""
              echo "- $detail"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      - name: Recheck an accepted protected change before this verdict publishes
        # agent-toolkit #3052: a pass that rests on an accepted protected change (aeos/accepted_change.py) re-reads
        # the pull request's context and then, as the LAST external observation, that entry from the policy
        # CURRENTLY on main, just before it publishes. An entry revoked, disabled or expired before that read, or a
        # head or description that moved, never publishes a success. The gate's marker is read first: a pass that
        # rests on no acceptance is untouched; one that does fails typed when anything it needs is unreadable; and an
        # unreadable marker fails closed where an acceptance could exist, judged from the event itself (a
        # machine-authored pull request, or any merge-group event, in the policy's target repository).
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          AEOS_REPOSITORY: ${{ github.repository }}
          AEOS_EVENT_NAME: ${{ github.event_name }}
          AEOS_EVENT_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
          AEOS_ACTOR_EVIDENCE: ${{ runner.temp }}/aeos-actor-evidence.json
          AEOS_APPROVAL_MARKER: ${{ runner.temp }}/aeos-approval-marker.json
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess, sys, time
          sys.path.insert(0, os.path.abspath('policy/aeos'))
          repo = os.environ.get("AEOS_REPOSITORY", "")
          def api(path, *args):
              r = subprocess.run(["gh", "api", path, *args], capture_output=True, text=True, timeout=30, check=False)
              return json.loads(r.stdout) if r.returncode == 0 and r.stdout.strip() else None
          def fail(reason):
              line = "AEOS_MERGE_READY_RESULT: FAIL DERIVATION_POLICY_DIFF_UNSIGNED"
              detail = f"the accepted protected change this pass rests on no longer holds at publication: {reason}"
              print(line)
              print(detail)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as handle:
                      handle.write(f"## aeos-merge-ready\n\n{line}\n\n- {detail}\n")
              sys.exit(1)
          UNREAD = object()
          try:
              with open(os.environ["AEOS_APPROVAL_MARKER"], encoding="utf-8") as handle:
                  marker = json.load(handle)
              dependence = marker["accepted_change"] if isinstance(marker, dict) else UNREAD
          except (OSError, ValueError, KeyError, TypeError):
              dependence = UNREAD
          if dependence is None:
              sys.exit(0)
          try:
              import accepted_change
              import derivation_policy
              import operator_approval
              if dependence is UNREAD:
                  policy = derivation_policy.load_policy('policy/aeos')
                  machines = {login for login, _kind in policy.machine_principals} if policy is not None else set()
                  # A merge-group event carries no pull-request author, and an acceptance can admit one: in the
                  # target repository it always fails closed.
                  if (policy is None or repo.strip().lower() != policy.target_repository
                          or (os.environ.get("AEOS_EVENT_NAME", "") != "merge_group"
                              and os.environ.get("AEOS_EVENT_AUTHOR", "") not in machines)):
                      sys.exit(0)
                  fail(accepted_change.ACCEPTED_CHANGE_DEPENDENCE_UNREADABLE)
              with open(os.environ["AEOS_ACTOR_EVIDENCE"], encoding="utf-8") as handle:
                  doc = json.load(handle)
              pr = doc["pull_request"]
              fresh = operator_approval.collect(api, repo, pr.get("number"), pr.get("head_sha"), pr.get("body"))
              blob = api("repos/First-AI-Movers/.github/contents/aeos/standing-governor-policy.json?ref=main")
              current = derivation_policy.parse_policy(base64.b64decode(blob["content"]))
              reason = accepted_change.withdrawn(current.accepted_changes, dependence, context=fresh.get("context"),
                                                 now=time.time())
          except SystemExit:
              raise
          except Exception as error:  # noqa: BLE001 - an acceptance that cannot be re-read never publishes a pass
              reason = f"ACCEPTED_CHANGE_DEPENDENCE_UNREADABLE ({type(error).__name__})"
          if reason is None:
              sys.exit(0)
          fail(reason)
          PY
      - name: Recheck the operator's approval before this verdict publishes
        # agent-toolkit #3052. A pass that rested on the operator's approval of this head is re-read here,
        # last, with the same collector: if the approval was withdrawn, or the pull request's head or
        # description changed, while this run was judging, the run fails instead of publishing a stale
        # success. A run whose evidence carries no approval, or whose approval never held, is untouched.
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          AEOS_REPOSITORY: ${{ github.repository }}
          AEOS_HEAD_SHA: >-
            ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha
            || github.event_name == 'pull_request' && github.event.pull_request.head.sha
            || github.sha }}
          AEOS_ACTOR_EVIDENCE: ${{ runner.temp }}/aeos-actor-evidence.json
          AEOS_APPROVAL_MARKER: ${{ runner.temp }}/aeos-approval-marker.json
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          sys.path.insert(0, os.path.abspath('policy/aeos'))
          repo = os.environ.get("AEOS_REPOSITORY", "")
          head = os.environ.get("AEOS_HEAD_SHA", "")
          def api(path, *args):
              r = subprocess.run(["gh", "api", path, *args], capture_output=True, text=True, timeout=30, check=False)
              return json.loads(r.stdout) if r.returncode == 0 and r.stdout.strip() else None
          try:
              with open(os.environ["AEOS_ACTOR_EVIDENCE"], encoding="utf-8") as handle:
                  doc = json.load(handle)
          except Exception:  # noqa: BLE001 - the gate step judged this evidence already; no approval rested on it
              sys.exit(0)
          pr = doc.get("pull_request") if isinstance(doc, dict) else None
          if not isinstance(pr, dict) or "approval" not in pr:
              sys.exit(0)
          # The gate records whether its pass rested on the approval. Only an explicit "no" skips the recheck;
          # a marker that is missing or unreadable is treated as "yes".
          try:
              with open(os.environ["AEOS_APPROVAL_MARKER"], encoding="utf-8") as handle:
                  if json.load(handle).get("approval_dependent") is False:
                      sys.exit(0)
          except (OSError, ValueError, AttributeError, KeyError):
              pass
          code = "EVIDENCE_UNREADABLE"
          try:
              import derivation_policy
              import merge_ready_gate
              import operator_approval
              code = (merge_ready_gate.CONTROL_PLANE_CHANGE_REQUIRES_OPERATOR
                      if repo.strip().lower() == merge_ready_gate.POLICY_REPOSITORY
                      else derivation_policy.DERIVATION_POLICY_DIFF_UNSIGNED)
              policy = derivation_policy.load_policy('policy/aeos')
              if operator_approval.refusal(policy, doc, repo, head) is not None:
                  sys.exit(0)
              fresh = operator_approval.collect(api, repo, pr.get("number"), pr.get("head_sha"), pr.get("body"))
              reason = operator_approval.withdrawn(policy, doc, repo, head, fresh)
          except Exception as error:  # noqa: BLE001 - an approval that cannot be re-read never publishes a pass
              reason = f"OPERATOR_APPROVAL_REVIEWS_UNREADABLE ({type(error).__name__})"
          if reason is None:
              sys.exit(0)
          line = f"AEOS_MERGE_READY_RESULT: FAIL {code}"
          detail = f"the operator's approval of this head no longer holds at publication: {reason}"
          print(line)
          print(detail)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"## aeos-merge-ready\n\n{line}\n\n- {detail}\n")
          sys.exit(1)
          PY
